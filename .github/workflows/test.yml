name: tests

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests --tb=short
      - name: Process-tree cancel, repeated (was intermittent on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 5; $i++) {
            python -m pytest -q tests/test_asama_a.py -k agaci
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
